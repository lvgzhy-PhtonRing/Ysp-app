<script>
// ===== INVENTORY MODULE =====
const CATEGORY_ORDER = ['日淘','美淘','国内','2025JAPAN'];
const BRAND_ORDER = ['hotwheels','minigt','tlv','kyosho','tomica','matchbox','ar box','kingmodel','mortal','其它'];
const DEFAULT_BATCHES = {
  '美淘': ['26下半年','26上半年','B组下半年','B组上半年','A组下半年','A组上半年'],
  '日淘': ['26h批','26g批','26f批','26e批','预订','d批','c批','b批','a批'],
  '国内': ['MINIGT预定','Hotwheels预定','国内现货','代理预定','2026苏州','2026HK香港','2026佛山'],
  '2025JAPAN': ['2025JAPAN'],
};

function normBrand(b) { return String(b||'').trim().toLowerCase(); }
function brandRank(b) { const i=BRAND_ORDER.indexOf(normBrand(b)); return i>=0?i:99; }
function catRank(c) { const i=CATEGORY_ORDER.indexOf(String(c||'')); return i>=0?i:99; }
function batchRank(cat, batch) {
  const b = String(batch||'').trim().toLowerCase();
  if (cat==='日淘') {
    if(b.includes('26h'))return 0; if(b.includes('26g'))return 1;
    if(b.includes('26f'))return 2; if(b.includes('26e'))return 3;
    if(b.includes('预订'))return 4; if(b==='d'||b.includes('d批'))return 5;
    if(b==='c'||b.includes('c批'))return 6; if(b==='b'||b.includes('b批'))return 7;
    if(b==='a'||b.includes('a批'))return 8; return 99;
  }
  if (cat==='美淘') {
    if(b.includes('26下半年'))return 0; if(b.includes('26上半年'))return 1;
    if(b.includes('b组下半年'))return 2; if(b.includes('b组上半年'))return 3;
    if(b.includes('a组下半年'))return 4; if(b.includes('a组上半年'))return 5; return 99;
  }
  if (cat==='国内') {
    if(b.includes('国内现货'))return 0; if(b.includes('代理预定'))return 1;
    if(b.includes('2026苏州'))return 2; return 99;
  }
  return 99;
}

function filterInventoryItems() {
  const f = APP.invFilters;
  const kwNorm = String(f.keyword||'').trim().toLowerCase();
  let items = filterOwnerItems(APP.data.items).filter(i => {
    if (i.status !== 'inventory') return false;
    if (f.category !== '全部' && i.category !== f.category) return false;
    if (f.batch !== '全部' && i.batch !== f.batch) return false;
    if (f.brand !== '全部' && i.brand !== f.brand) return false;
    if (kwNorm) {
      const name = String(i.name||'').toLowerCase();
      const sid = String(i.sid||'').toLowerCase();
      if (!name.includes(kwNorm) && !sid.includes(kwNorm)) return false;
    }
    return true;
  });
  // long/short filter
  if (APP.invFilterMode === 'long') items = items.filter(i => i.isLongTerm === true);
  if (APP.invFilterMode === 'short') items = items.filter(i => i.isLongTerm !== true);
  return items;
}

function groupInventoryItems(items) {
  const mode = APP.invViewMode;
  const map = new Map();

  items.forEach(item => {
    let key, groupLabel, groupBatch;
    if (mode === 'all') { key='all'; groupLabel='全列表'; groupBatch='全部'; }
    else if (mode === 'category') { key=item.category||'未分类'; groupLabel=key; groupBatch='按大类'; }
    else if (mode === 'brand') { key=item.brand||'未分类品牌'; groupLabel=key; groupBatch=''; }
    else { // batch
      key=`${item.category||'未分类'}__${item.batch||'未分批'}`;
      groupLabel=item.category||'未分类'; groupBatch=item.batch||'未分批';
    }

    if (!map.has(key)) {
      map.set(key, { key, label:groupLabel, batch:groupBatch, category:item.category||'',
        items:[], count:0, totalCost:0, longTermCount:0, longTermValue:0, defectCount:0, defectValue:0 });
    }
    const g = map.get(key);
    g.items.push(item);
    g.count++;
    g.totalCost += toNum(item.cost);
    if (item.isLongTerm) { g.longTermCount++; g.longTermValue += toNum(item.cost); }
    if (item.isDefect) { g.defectCount++; g.defectValue += toNum(item.cost); }
  });

  // merge items by sid+name within each group
  map.forEach(g => { g.mergedItems = mergeItemsBySidName(g.items); });

  // sort groups
  let groups = Array.from(map.values());
  if (mode === 'batch') {
    groups.sort((a,b) => {
      const c1=catRank(a.category), c2=catRank(b.category);
      if(c1!==c2) return c1-c2;
      return batchRank(a.category,a.batch) - batchRank(b.category,b.batch);
    });
  } else if (mode === 'category') {
    groups.sort((a,b) => catRank(a.label)-catRank(b.label));
  } else if (mode === 'brand') {
    groups.sort((a,b) => brandRank(a.label)-brandRank(b.label));
  }
  return groups;
}

function mergeItemsBySidName(items) {
  const merged = new Map();
  items.forEach(item => {
    const key = `${itemOwner(item)}|${item.sid||''}|${item.name||''}`;
    if (!merged.has(key)) {
      merged.set(key, { ...item, qty:1, itemIds:[item.id], totalCost:toNum(item.cost),
        longTermCount:item.isLongTerm?1:0, longTermValue:item.isLongTerm?toNum(item.cost):0,
        defectCount:item.isDefect?1:0, defectValue:item.isDefect?toNum(item.cost):0 });
      return;
    }
    const g = merged.get(key);
    g.qty++;
    g.itemIds.push(item.id);
    g.totalCost += toNum(item.cost);
    if (item.isLongTerm) { g.longTermCount++; g.longTermValue += toNum(item.cost); if(!g.isLongTerm) g.isLongTerm=true; }
    if (item.isDefect) { g.defectCount++; g.defectValue += toNum(item.cost); if(!g.isDefect) g.isDefect=true; }
  });
  return Array.from(merged.values());
}

function getInvStats() {
  const items = filterOwnerItems(APP.data.items);
  const inv = items.filter(i=>i.status==='inventory');
  const pur = items.filter(i=>i.status==='purchase');
  const lt = inv.filter(i=>i.isLongTerm===true);
  const def = inv.filter(i=>i.isDefect===true);
  return {
    invCount: inv.length,
    invValue: inv.reduce((s,i)=>s+toNum(i.cost),0),
    purCount: pur.length,
    ltCount: lt.length,
    ltValue: lt.reduce((s,i)=>s+toNum(i.cost),0),
    defCount: def.length,
  };
}

function renderInventory() {
  const stats = getInvStats();
  const items = filterInventoryItems();
  const groups = groupInventoryItems(items);

  // build category options
  const cats = ['全部', ...CATEGORY_ORDER.filter(c =>
    filterOwnerItems(APP.data.items).some(i=>i.status==='inventory'&&i.category===c)
  )];
  // build batch options for selected category
  let batches = ['全部'];
  if (APP.invFilters.category !== '全部') {
    const bSet = new Set();
    filterOwnerItems(APP.data.items).filter(i=>i.status==='inventory'&&i.category===APP.invFilters.category)
      .forEach(i=>{ if(i.batch) bSet.add(i.batch); });
    const order = DEFAULT_BATCHES[APP.invFilters.category]||[];
    batches = ['全部', ...Array.from(bSet).sort((a,b)=>{
      const ia=order.indexOf(a), ib=order.indexOf(b);
      if(ia!==ib) return (ia>=0?ia:99)-(ib>=0?ib:99);
      return String(a).localeCompare(String(b),'zh-CN');
    })];
  }
  // brand options
  const brandSet = new Set(['全部']);
  filterOwnerItems(APP.data.items).filter(i=>i.status==='inventory').forEach(i=>{ if(i.brand) brandSet.add(i.brand); });
  const brands = Array.from(brandSet);

  document.getElementById('inv-subtitle').textContent =
    `库存 ${stats.invCount} 件 · ¥${fmtMoney(stats.invValue)}`;

  let html = '';

  // Stats cards
  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-val blue">${stats.invCount}</div><div class="stat-label">${APP.ownerFilter==='payton'?'自留+投资库存':'库存件数'}</div></div>
    <div class="stat-card"><div class="stat-val blue">${fmtMoney(stats.invValue)}</div><div class="stat-label">库存货值</div></div>
    <div class="stat-card"><div class="stat-val orange">${stats.ltCount}</div><div class="stat-label">${APP.ownerFilter==='payton'?'自留件数':'长线件数'}</div></div>
    <div class="stat-card"><div class="stat-val orange">${fmtMoney(stats.ltValue)}</div><div class="stat-label">${APP.ownerFilter==='payton'?'自留货值':'长线货值'}</div></div>
    <div class="stat-card"><div class="stat-val red">${stats.defCount}</div><div class="stat-label">残次件数</div></div>
    <div class="stat-card"><div class="stat-val purple">${fmtMoney(stats.invValue-stats.ltValue)}</div><div class="stat-label">${APP.ownerFilter==='payton'?'投资货值':'短线货值'}</div></div>
  </div>`;

  // Long/short filter
  html += `<div class="inv-filter-row" style="margin-top:10px">
    <button class="inv-filter-btn all ${APP.invFilterMode==='all'?'active':''}" onclick="setInvFilterMode('all')">全部</button>
    <button class="inv-filter-btn ${APP.invFilterMode==='short'?'active short':''}" onclick="setInvFilterMode('short')">${APP.ownerFilter==='payton'?'投资':'上架短线'}</button>
    <button class="inv-filter-btn ${APP.invFilterMode==='long'?'active':''}" onclick="setInvFilterMode('long')">${APP.ownerFilter==='payton'?'自留':'长线库存'}</button>
  </div>`;

  // View mode tabs
  html += `<div class="view-tabs">
    <button class="view-tab ${APP.invViewMode==='batch'?'active':''}" onclick="setInvView('batch')">批次</button>
    <button class="view-tab ${APP.invViewMode==='category'?'active':''}" onclick="setInvView('category')">大类</button>
    <button class="view-tab ${APP.invViewMode==='brand'?'active':''}" onclick="setInvView('brand')">品牌</button>
    <button class="view-tab ${APP.invViewMode==='all'?'active':''}" onclick="setInvView('all')">全列表</button>
  </div>`;

  // Category filter chips
  html += `<div class="filter-bar">`;
  cats.forEach(c => {
    html += `<button class="filter-chip ${APP.invFilters.category===c?'active':''}" onclick="setInvCat('${esc(c)}')">${esc(c)}</button>`;
  });
  html += `</div>`;

  // Batch filter chips (only when category selected)
  if (APP.invFilters.category !== '全部' && batches.length > 1) {
    html += `<div class="filter-bar">`;
    batches.forEach(b => {
      html += `<button class="filter-chip small ${APP.invFilters.batch===b?'active':''}" onclick="setInvBatch('${esc(b)}')">${esc(b)}</button>`;
    });
    html += `</div>`;
  }

  // Brand filter chips
  if (brands.length > 2) {
    html += `<div class="filter-bar">`;
    brands.forEach(b => {
      html += `<button class="filter-chip small ${APP.invFilters.brand===b?'active':''}" onclick="setInvBrand('${esc(b)}')">${esc(b)}</button>`;
    });
    html += `</div>`;
  }

  // Search
  html += `<div class="search-wrap">
    <input class="search-input" type="text" placeholder="搜索名称或SID" value="${esc(APP.invFilters.keyword)}"
      oninput="setInvKeyword(this.value)">
  </div>`;

  // Groups
  if (groups.length === 0) {
    html += `<div class="empty-state">暂无库存数据</div>`;
  } else {
    groups.forEach(g => {
      const gKey = 'inv_' + g.key;
      const expanded = APP.collapsedGroups[gKey] === true;
      const chevron = expanded ? '▼' : '▶';
      const groupTitle = APP.invViewMode === 'batch'
        ? `${g.label} · ${g.batch}`
        : g.label;

      html += `<div class="group-section">
        <div class="group-header ${expanded?'expanded':''}" onclick="toggleInvGroup('${esc(gKey)}')">
          <div>
            <div class="group-name">${esc(groupTitle)}</div>
            <div class="group-meta">${g.count} 件 · ¥${fmtMoney(g.totalCost)}</div>
          </div>
          <div class="group-badge">`;
      if (g.longTermCount > 0) html += `<span class="badge orange">${APP.ownerFilter==='payton'?'自留':'长线'} ${g.longTermCount}</span>`;
      if (g.defectCount > 0) html += `<span class="badge red">残次 ${g.defectCount}</span>`;
      html += `<span class="chevron ${expanded?'open':''}">${chevron}</span>
          </div>
        </div>`;

      if (expanded) {
        html += `<div class="item-list">`;
        g.mergedItems.forEach(item => {
          html += `<div class="item-row" onclick="openItemDetail(${JSON.stringify(item.id)})" style="cursor:pointer">
            <div class="item-main">
              <div class="item-name">${esc(item.name)}</div>
              <div class="item-sid">${esc(item.sid||'')} · ${esc(item.brand||'')} · ${esc(item.batch||'')}${ownerBadgeHtml(item)}</div>
              <div class="item-tags">`;
          if (item.isLongTerm) html += `<span class="tag longterm">${APP.ownerFilter==='payton'?'自留':'长线'}</span>`;
          if (item.isDefect) html += `<span class="tag defect">残次</span>`;
          if (item.qty > 1 && item.longTermCount > 0 && item.longTermCount < item.qty)
            html += `<span class="tag longterm">${APP.ownerFilter==='payton'?'自留':'长线'} ${item.longTermCount}/${item.qty}</span>`;
          html += `</div>
            </div>
            <div class="item-right">
              <div class="item-cost">¥${fmtMoney(item.qty > 1 ? item.totalCost : item.cost)}</div>
              ${item.qty > 1 ? `<div class="item-qty">×${item.qty} · 单价¥${fmtMoney(item.cost)}</div>` : ''}
            </div>
          </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
  }

  document.getElementById('inventory-content').innerHTML = html;
}

function setInvView(v) { APP.invViewMode=v; renderInventory(); }
function setInvFilterMode(v) { APP.invFilterMode=v; renderInventory(); }
function setInvCat(v) { APP.invFilters.category=v; APP.invFilters.batch='全部'; renderInventory(); }
function setInvBatch(v) { APP.invFilters.batch=v; renderInventory(); }
function setInvBrand(v) { APP.invFilters.brand=v; renderInventory(); }
function setInvKeyword(v) { APP.invFilters.keyword=v; renderInventory(); }
function toggleInvGroup(key) {
  APP.collapsedGroups[key] = !APP.collapsedGroups[key];
  renderInventory();
}
</script>

<script>
// ===== SALES MODULE =====
function normFuzzy(s) {
  return String(s||'').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g,'');
}

function getVisibleSoldItems() {
  const owner=APP.salesOwnerScope==='all'?'all':APP.ownerFilter;
  return filterOwnerItems(APP.data.items.filter(i=>i.status==='sold'),owner).filter(i => APP.shopFilter === '全部' || getSalesChannel(i) === APP.shopFilter);
}

function filterSoldItems() {
  const f = APP.salesFilters;
  const kw = normFuzzy(f.keyword);
  return getVisibleSoldItems().filter(i => {
    if (!i.saleDetails) return false;
    if (f.category !== '全部' && i.category !== f.category) return false;
    if (f.batch !== '全部' && i.batch !== f.batch) return false;
    if (kw) {
      const hay = normFuzzy(`${i.sid||''} ${i.name||''} ${i.brand||''} ${i.batch||''} ${i.category||''}`);
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
}

function groupSoldItems(items) {
  const mode = APP.salesViewMode;
  const map = new Map();

  const getTs = i => {
    const d = i.saleDetails?.date;
    if (!d) return 0;
    const t = new Date(d).getTime();
    return isFinite(t) ? t : 0;
  };

  items.forEach(item => {
    let key;
    if (mode === 'all') key = String(item.id);
    else if (mode === 'month') key = item.saleDetails?.date?.slice(0,7) || '未记录月份';
    else if (mode === 'category') key = item.category || '未分类';
    else if (mode === 'batch') key = `${item.category||'未分类'} / ${item.batch||'未分批'}`;
    else key = item.brand || '未分类品牌'; // brand

    if (!map.has(key)) {
      const title = mode === 'all' ? `${item.sid||''} / ${item.name||''}` : key;
      map.set(key, { key, title, items:[], count:0, revenue:0, cost:0, profit:0 });
    }
    const g = map.get(key);
    g.items.push(item);
    g.count++;
    g.revenue += toNum(item.saleDetails?.price);
    g.cost += toNum(item.cost);
    g.profit += toNum(item.saleDetails?.profit);
  });

  // sort items within each group by date desc
  map.forEach(g => {
    g.items.sort((a,b) => {
      const ta=getTs(a), tb=getTs(b);
      if(tb!==ta) return tb-ta;
      return Number(b.id||0)-Number(a.id||0);
    });
  });

  let groups = Array.from(map.values());

  if (mode === 'all') {
    groups.sort((a,b) => {
      const da=a.items[0]?.saleDetails?.date||'', db=b.items[0]?.saleDetails?.date||'';
      return String(db).localeCompare(String(da));
    });
  } else if (mode === 'month') {
    groups.sort((a,b) => String(b.key).localeCompare(String(a.key)));
  } else if (mode === 'category') {
    groups.sort((a,b) => {
      const x=catRank(a.key), y=catRank(b.key);
      if(x!==y) return x-y;
      return String(a.key).localeCompare(String(b.key),'zh-CN');
    });
  } else if (mode === 'batch') {
    groups.sort((a,b) => {
      const [ca,ba]=String(a.key||'').split(' / ');
      const [cb,bb]=String(b.key||'').split(' / ');
      const c1=catRank(ca), c2=catRank(cb);
      if(c1!==c2) return c1-c2;
      const br1=batchRank(ca,ba), br2=batchRank(cb,bb);
      if(br1!==br2) return br1-br2;
      return String(ba).localeCompare(String(bb),'zh-CN');
    });
  } else { // brand
    groups.sort((a,b) => {
      const r1=brandRank(a.key), r2=brandRank(b.key);
      if(r1!==r2) return r1-r2;
      return String(a.key).localeCompare(String(b.key),'zh-CN');
    });
  }
  return groups;
}

function getSalesStats() {
  const sold = getVisibleSoldItems();
  const totalRevenue = sold.reduce((s,i)=>s+toNum(i.saleDetails?.price),0);
  const totalProfit = sold.reduce((s,i)=>s+toNum(i.saleDetails?.profit),0);
  const totalCost = sold.reduce((s,i)=>s+toNum(i.cost),0);
  const profitMargin = totalCost>0 ? totalProfit/totalCost : 0;
  const recoveryRate = totalCost>0 ? totalRevenue/totalCost : 0;
  return { count:sold.length, totalRevenue, totalProfit, totalCost, profitMargin, recoveryRate };
}

function renderSales() {
  const stats = getSalesStats();
  const items = filterSoldItems();
  const groups = groupSoldItems(items);

  // category options
  const catSet = new Set(['全部']);
  getVisibleSoldItems().forEach(i=>{ if(i.category) catSet.add(i.category); });
  const cats = Array.from(catSet);

  // batch options
  let batches = ['全部'];
  const bSet = new Set();
  getVisibleSoldItems().filter(i=>(APP.salesFilters.category==='全部'||i.category===APP.salesFilters.category))
    .forEach(i=>{ if(i.batch) bSet.add(i.batch); });
  batches = ['全部', ...Array.from(bSet)];

  document.getElementById('sales-subtitle').textContent =
    `已售 ${stats.count} 件 · 利润 ¥${fmtMoney(stats.totalProfit)}`;

  let html = '';

  // Stats
  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-val blue">${stats.count}</div><div class="stat-label">已售件数</div></div>
    <div class="stat-card"><div class="stat-val blue">${fmtMoney(stats.totalRevenue)}</div><div class="stat-label">总回款</div></div>
    <div class="stat-card"><div class="stat-val">${fmtMoney(stats.totalCost)}</div><div class="stat-label">总成本</div></div>
    <div class="stat-card"><div class="stat-val ${stats.totalProfit>=0?'green':'red'}">${fmtMoney(stats.totalProfit)}</div><div class="stat-label">总利润</div></div>
    <div class="stat-card"><div class="stat-val purple">${fmt(stats.profitMargin*100,1)}%</div><div class="stat-label">利润率</div></div>
    <div class="stat-card"><div class="stat-val teal">${fmt(stats.recoveryRate*100,1)}%</div><div class="stat-label">回本率</div></div>
  </div>`;

  html += `<div class="filter-bar" aria-label="销售 Owner 范围">
    <button class="filter-chip ${APP.salesOwnerScope==='current'?'active':''}" aria-pressed="${APP.salesOwnerScope==='current'}" onclick="setSalesOwnerScope('current')">当前 Owner</button>
    <button class="filter-chip ${APP.salesOwnerScope==='all'?'active':''}" aria-pressed="${APP.salesOwnerScope==='all'}" onclick="setSalesOwnerScope('all')">全部 Owner</button>
  </div>`;

  html += `<div class="filter-bar" aria-label="销售渠道筛选">`;
  ['全部', ...SALES_CHANNELS].forEach(shop => { html += `<button class="filter-chip ${APP.shopFilter===shop?'active':''}" aria-pressed="${APP.shopFilter===shop}" onclick="setShopFilter('${esc(shop)}')">${esc(shop)}</button>`; });
  html += `</div>`;

  // View mode tabs
  html += `<div class="view-tabs">
    <button class="view-tab ${APP.salesViewMode==='month'?'active':''}" onclick="setSalesView('month')">月份</button>
    <button class="view-tab ${APP.salesViewMode==='batch'?'active':''}" onclick="setSalesView('batch')">批次</button>
    <button class="view-tab ${APP.salesViewMode==='category'?'active':''}" onclick="setSalesView('category')">大类</button>
    <button class="view-tab ${APP.salesViewMode==='brand'?'active':''}" onclick="setSalesView('brand')">品牌</button>
    <button class="view-tab ${APP.salesViewMode==='all'?'active':''}" onclick="setSalesView('all')">全列表</button>
  </div>`;

  // Category filter
  html += `<div class="filter-bar">`;
  cats.forEach(c => {
    html += `<button class="filter-chip ${APP.salesFilters.category===c?'active':''}" onclick="setSalesCat('${esc(c)}')">${esc(c)}</button>`;
  });
  html += `</div>`;

  // Batch filter
  if (batches.length > 2) {
    html += `<div class="filter-bar">`;
    batches.forEach(b => {
      html += `<button class="filter-chip small ${APP.salesFilters.batch===b?'active':''}" onclick="setSalesBatch('${esc(b)}')">${esc(b)}</button>`;
    });
    html += `</div>`;
  }

  // Search
  html += `<div class="search-wrap">
    <input class="search-input" type="text" placeholder="搜索名称/SID/品牌" value="${esc(APP.salesFilters.keyword)}"
      oninput="setSalesKeyword(this.value)">
  </div>`;

  if (groups.length === 0) {
    html += `<div class="empty-state">暂无销售数据</div>`;
  } else {
    groups.forEach(g => {
      const gKey = 'sales_' + g.key;
      const expanded = APP.collapsedGroups[gKey] === true;

      if (APP.salesViewMode === 'all') {
        // flat list
        const item = g.items[0];
        const sd = item.saleDetails || {};
        html += `<div class="card" style="margin-top:8px;cursor:pointer" onclick="openItemDetail(${JSON.stringify(item.id)})">
          <div class="card-body" style="padding:10px 14px">
            <div class="row-flex">
              <div>
                <div class="item-name">${esc(item.name)}</div>
                <div class="item-sid">${esc(item.sid||'')} · ${esc(item.brand||'')} · ${esc(sd.date||'')}${APP.salesOwnerScope==='all'?ownerBadgeHtml(item):''}</div><div class="item-tags">${saleStatusTags(sd)}</div>
              </div>
              <div class="item-right">
                <div class="item-cost">¥${fmtMoney(sd.price)}</div>
                <div class="item-qty ${profitClass(sd.profit)}">${fmtProfit(sd.profit)}</div>
              </div>
            </div>
            <div style="display:flex;gap:12px;margin-top:6px;font-size:12px;color:#8e8e93">
              <span>成本 ¥${fmtMoney(item.cost)}</span>
              ${toNum(sd.express)>0?`<span>快递 ¥${fmtMoney(sd.express)}</span>`:''}
              ${toNum(sd.feeRate)>0?`<span>费率 ${fmt(sd.feeRate*100,1)}%</span>`:''}
              ${toNum(sd.deduction)>0?`<span>扣款 ¥${fmtMoney(sd.deduction)}</span>`:''}
            </div>
          </div>
        </div>`;
      } else {
        const profitRate = g.cost > 0 ? g.profit/g.cost*100 : 0;
        html += `<div class="group-section">
          <div class="group-header ${expanded?'expanded':''}" onclick="toggleSalesGroup('${esc(gKey)}')">
            <div>
              <div class="group-name">${esc(g.title)}</div>
              <div class="group-meta">${g.count} 件 · 回款¥${fmtMoney(g.revenue)} · 利润¥${fmtMoney(g.profit)}</div>
            </div>
            <div class="group-badge">
              <span class="badge ${profitRate>=0?'green':'red'}">${fmt(profitRate,1)}%</span>
              <span class="chevron ${expanded?'open':''}">${expanded?'▼':'▶'}</span>
            </div>
          </div>`;

        if (expanded) {
          html += `<div class="item-list">`;
          g.items.forEach(item => {
            const sd = item.saleDetails || {};
            html += `<div class="item-row" onclick="openItemDetail(${JSON.stringify(item.id)})" style="cursor:pointer">
              <div class="item-main">
                <div class="item-name">${esc(item.name)}</div>
                <div class="item-sid">${esc(item.sid||'')} · ${esc(item.brand||'')} · ${esc(sd.date||'')}${APP.salesOwnerScope==='all'?ownerBadgeHtml(item):''}</div>
                <div style="font-size:12px;color:#8e8e93;margin-top:3px">
                  成本¥${fmtMoney(item.cost)}
                  ${toNum(sd.express)>0?' · 快递¥'+fmtMoney(sd.express):''}
                  ${toNum(sd.feeRate)>0?' · 费率'+fmt(sd.feeRate*100,1)+'%':''}
                  ${toNum(sd.deduction)>0?' · 扣款¥'+fmtMoney(sd.deduction):''}
                </div>
              </div>
              <div class="item-right">
                <div class="item-cost">¥${fmtMoney(sd.price)}</div>
                <div class="item-qty ${profitClass(sd.profit)}">${fmtProfit(sd.profit)}</div>
              </div>
            </div>`;
          });
          html += `</div>`;
        }
        html += `</div>`;
      }
    });
  }

  document.getElementById('sales-content').innerHTML = html;
}

function setSalesView(v) { APP.salesViewMode=v; renderSales(); }
function setSalesCat(v) { APP.salesFilters.category=v; APP.salesFilters.batch='全部'; renderSales(); }
function setSalesBatch(v) { APP.salesFilters.batch=v; renderSales(); }
function setSalesKeyword(v) { APP.salesFilters.keyword=v; renderSales(); }
function toggleSalesGroup(key) {
  APP.collapsedGroups[key] = !APP.collapsedGroups[key];
  renderSales();
}
</script>

<script>
// ===== PURCHASE & TRANSFER MODULE =====
const PURCHASE_TABS = ['日淘','美淘','国内'];

function getPurchaseGroupKey(item) {
  const pgId = String(item.purchaseDetails?.purchaseGroupId||'').trim();
  const pb = String(item.purchaseDetails?.paymentBatch||'').trim();
  if (pgId && pb) return `${pgId}__${pb}`;
  if (pgId) return pgId;
  return `${item.purchaseDetails?.date||''}__${item.purchaseDetails?.website||''}__${pb}`;
}

function mergeItemsBySid(items) {
  const getSortTs = item => {
    const d = item.purchaseDetails?.date;
    const dateTs = d ? new Date(d).getTime() : 0;
    const idTs = Number(item.id||0);
    return (isFinite(dateTs)?dateTs:0)*1000000 + (isFinite(idTs)?idTs:0);
  };
  const map = new Map();
  items.forEach(item => {
    const key = `${itemOwner(item)}|${item.sid||''}`;
    if (!map.has(key)) {
      map.set(key, {...item, qty:1, _latestTs:getSortTs(item)});
      return;
    }
    const g = map.get(key);
    g.qty++;
    g._latestTs = Math.max(Number(g._latestTs||0), getSortTs(item));
  });
  return Array.from(map.values())
    .sort((a,b) => Number(b._latestTs||0)-Number(a._latestTs||0))
    .map(item => { const n={...item}; delete n._latestTs; return n; });
}

function buildPurchaseGroups(categoryItems) {
  // Level 1: batch groups
  const batchMap = new Map();
  categoryItems.forEach(item => {
    const key = `${item.category||'未分类'}__${item.batch||'未分批'}`;
    if (!batchMap.has(key)) {
      batchMap.set(key, {
        key, category:item.category||'未分类', batch:item.batch||'未分批',
        count:0, totalAmount:0, purchase:0, transfer:0,
        pgMap: new Map()
      });
    }
    const bg = batchMap.get(key);
    bg.count++;
    bg.totalAmount += toNum(item.cost);
    bg.purchase += toNum(item.purchaseDetails?.preTransferCost);
    bg.transfer += toNum(item.purchaseDetails?.transferCost);

    // Level 2: purchase group
    const pgKey = getPurchaseGroupKey(item);
    if (!bg.pgMap.has(pgKey)) {
      const pd = item.purchaseDetails || {};
      bg.pgMap.set(pgKey, {
        key: pgKey,
        purchaseGroupId: pd.purchaseGroupId||'',
        paymentBatch: pd.paymentBatch||'',
        date: pd.date||'',
        website: pd.website||'',
        websiteAccount: pd.websiteAccount||'',
        paymentAccount: pd.paymentAccount||'',
        discount: pd.discount||'',
        totalRMB: toNum(pd.totalRMB),
        count:0, totalAmount:0, purchase:0, transfer:0,
        items:[]
      });
    }
    const pg = bg.pgMap.get(pgKey);
    pg.count++;
    pg.totalAmount += toNum(item.cost);
    pg.purchase += toNum(item.purchaseDetails?.preTransferCost);
    pg.transfer += toNum(item.purchaseDetails?.transferCost);
    pg.items.push(item);
  });

  // sort batches
  const batches = Array.from(batchMap.values());
  batches.sort((a,b) => batchRank(a.category,a.batch)-batchRank(b.category,b.batch));

  // sort purchase groups by date desc within each batch
  batches.forEach(bg => {
    const pgs = Array.from(bg.pgMap.values());
    pgs.sort((a,b) => String(b.date).localeCompare(String(a.date)));
    // merge items by sid within each pg
    pgs.forEach(pg => { pg.mergedItems = mergeItemsBySid(pg.items); });
    bg.purchaseGroups = pgs;
  });

  return batches;
}

function getVisiblePurchaseGroups() {
  const categoryItems = filterOwnerItems(APP.data.items).filter(i=>i.status==='purchase'&&i.category===APP.purchaseTab);
  const groups = buildPurchaseGroups(categoryItems).flatMap(bg => bg.purchaseGroups.map(pg => ({bg, pg, key:'pur_pg_'+bg.key+'_'+pg.key})));
  const batchFiltered = groups.filter(({bg}) => APP.purchaseBatchFilter==='全部' || bg.batch===APP.purchaseBatchFilter);
  const keyword = String(APP.purchaseKeyword||'').trim().toLocaleLowerCase();
  const visible = batchFiltered.filter(({bg,pg}) => !keyword || [bg.batch,pg.paymentBatch,pg.date,pg.website,pg.websiteAccount,pg.paymentAccount,...pg.items.flatMap(i=>[i.sid,i.name,i.brand])].some(v=>String(v||'').toLocaleLowerCase().includes(keyword)));
  return visible.sort((a,b)=>String(b.pg.date||'').localeCompare(String(a.pg.date||'')) || String(b.pg.key).localeCompare(String(a.pg.key)));
}

function isPurchaseGroupExpanded(key, isLatest) {
  return Object.prototype.hasOwnProperty.call(APP.purchaseExpandedGroups,key) ? APP.purchaseExpandedGroups[key] : isLatest;
}

function buildTransferList(category) {
  const transfers = APP.data.transfers.filter(t => {
    if (category === '全部') return true;
    const transferCategory=getTransferItems(t)[0]?.category||t.category||'日淘';
    return transferCategory===category;
  });
  // sort by date desc
  return transfers.slice().sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
}

function getTransferItems(transfer) {
  const byIds=Array.isArray(transfer.itemIds)?APP.data.items.filter(i=>transfer.itemIds.includes(i.id)):[];
  return byIds.length?byIds:APP.data.items.filter(i=>i.purchaseDetails?.transferId===transfer.transferId);
}

function getPurchaseStats() {
  const items = filterOwnerItems(APP.data.items).filter(i=>i.status==='purchase' && PURCHASE_TABS.includes(i.category));
  const totalCount = items.length;
  const totalAmount = items.reduce((s,i)=>s+toNum(i.cost),0);
  const pendingCount = items.filter(i=>(i.purchaseDetails?.transferStatus||'pending')==='pending').length;
  const completedCount = items.filter(i=>i.purchaseDetails?.transferStatus==='completed').length;
  const byCategory = {};
  PURCHASE_TABS.forEach(c => {
    const ci = items.filter(i=>i.category===c);
    byCategory[c] = {
      count:ci.length,
      amount:ci.reduce((s,i)=>s+toNum(i.cost),0),
      purchase:ci.reduce((s,i)=>s+toNum(i.purchaseDetails?.preTransferCost),0),
      transfer:ci.reduce((s,i)=>s+toNum(i.purchaseDetails?.transferCost),0),
      pendingCount:ci.filter(i=>(i.purchaseDetails?.transferStatus||'pending')==='pending').length,
    };
  });
  return { totalCount, totalAmount, pendingCount, completedCount, byCategory };
}

function renderPurchase() {
  const stats = getPurchaseStats();
  const tab = APP.purchaseTab;
  const subTab = APP.purchaseTransferTab;

  document.getElementById('purchase-subtitle').textContent =
    `采购中 ${stats.totalCount} 件 · 待转运 ${stats.pendingCount} 件`;

  let html = '';

  // Overall stats
  html += `<div class="stats-row" style="grid-template-columns:repeat(2,1fr)">
    <div class="stat-card"><div class="stat-val orange">${stats.totalCount}</div><div class="stat-label">采购中(件)</div></div>
    <div class="stat-card"><div class="stat-val orange">${fmtMoney(stats.totalAmount)}</div><div class="stat-label">采购中金额</div></div>
    <div class="stat-card"><div class="stat-val red">${stats.pendingCount}</div><div class="stat-label">待转运</div></div>
    <div class="stat-card"><div class="stat-val green">${stats.completedCount}</div><div class="stat-label">已转运</div></div>
  </div>`;

  // Sub-tab: purchase / transfer
  html += `<div class="view-tabs" style="margin-top:10px">
    <button class="view-tab ${subTab==='purchase'?'active':''}" onclick="setPurchaseSubTab('purchase')">采购清单</button>
    <button class="view-tab ${subTab==='transfer'?'active':''}" onclick="setPurchaseSubTab('transfer')">转运清单</button>
  </div>`;

  if (subTab === 'purchase') {
    // Category tabs
    html += `<div class="filter-bar">`;
    PURCHASE_TABS.forEach(c => {
      const cs = stats.byCategory[c];
      html += `<button class="filter-chip ${tab===c?'active':''}" onclick="setPurchaseTab('${c}')">
        ${esc(c)} ${cs.count>0?`<span style="font-size:11px">(${cs.count})</span>`:''}
      </button>`;
    });
    html += `</div>`;

    // Category stats bar
    const cs = stats.byCategory[tab];
    html += `<div class="card" style="margin-top:8px">
      <div class="card-body" style="padding:10px 14px">
        <div style="display:flex;gap:16px;font-size:13px">
          <div><span style="color:#8e8e93">件数</span> <b>${cs.count}</b></div>
          <div><span style="color:#8e8e93">总额</span> <b>¥${fmtMoney(cs.amount)}</b></div>
          <div><span style="color:#8e8e93">采购</span> <b>¥${fmtMoney(cs.purchase)}</b></div>
          <div><span style="color:#8e8e93">转运</span> <b>¥${fmtMoney(cs.transfer)}</b></div>
        </div>
        <div style="margin-top:6px;font-size:12px;color:#8e8e93">待转运 ${cs.pendingCount} 件</div>
      </div>
    </div>`;

    const allGroups = buildPurchaseGroups(filterOwnerItems(APP.data.items).filter(i=>i.status==='purchase'&&i.category===tab));
    const batches = [...new Set(allGroups.map(bg=>bg.batch))];
    if (!batches.includes(APP.purchaseBatchFilter)) APP.purchaseBatchFilter='全部';
    html += `<div class="filter-bar" aria-label="按采购批次筛选">`;
    ['全部',...batches].forEach(batch=>{ html += `<button class="filter-chip small ${APP.purchaseBatchFilter===batch?'active':''}" aria-pressed="${APP.purchaseBatchFilter===batch}" onclick="setPurchaseBatchFilter('${esc(batch)}')">${esc(batch)}</button>`; });
    html += `</div>
      <div class="search-wrap"><input id="purchase-keyword" class="search-input" type="search" placeholder="搜索商品名称、SID、品牌或采购组" value="${esc(APP.purchaseKeyword)}" oninput="setPurchaseKeyword(this.value)" aria-label="搜索采购商品"></div>`;

    const visibleGroups = getVisiblePurchaseGroups();
    html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 16px 4px;font-size:12px;color:#8e8e93">
      <span>共 ${visibleGroups.length} 个采购组 · 按日期从新到旧</span>
      <span style="display:flex;gap:12px"><button style="color:#007aff" onclick="setVisiblePurchaseGroupsExpanded(true)">全部展开</button><button style="color:#007aff" onclick="setVisiblePurchaseGroupsExpanded(false)">全部收起</button></span>
    </div>`;

    if (visibleGroups.length === 0) {
      html += `<div class="empty-state">暂无采购数据</div>`;
    } else {
      visibleGroups.forEach(({bg,pg,key}, index) => {
            const pgExpanded = isPurchaseGroupExpanded(key,index===0);
            const title = pg.paymentBatch || [pg.date,pg.website].filter(Boolean).join(' · ') || '未填付款批次';
            const preview = pg.mergedItems.slice(0,3).map(i=>`${i.name}${i.qty>1?' ×'+i.qty:''}`).join('、');
            html += `<div class="sub-group" style="margin:6px 16px 0;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden">
              <div class="sub-group-header" role="button" tabindex="0" aria-expanded="${pgExpanded}" onclick="togglePurchaseGroup('${esc(key)}',${index===0})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePurchaseGroup('${esc(key)}',${index===0})}">
                <div style="min-width:0;flex:1">
                  <div class="sub-group-name">${esc(title)}</div>
                  <div class="sub-group-meta">${esc(bg.batch)} · ${pg.date?esc(pg.date):'日期未记录'}${pg.website?' · '+esc(pg.website):''}${pg.websiteAccount?' · '+esc(pg.websiteAccount):''}${pg.paymentAccount?' · '+esc(pg.paymentAccount):''}</div>
                  <div class="sub-group-meta">${pg.count} 件 · 总成本 ¥${fmtMoney(pg.totalAmount)} · 采购 ¥${fmtMoney(pg.purchase)} · 转运 ¥${fmtMoney(pg.transfer)}</div>
                  ${!pgExpanded&&preview?`<div class="sub-group-meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(preview)}</div>`:''}
                </div>
                <span class="chevron ${pgExpanded?'open':''}">▶</span>
              </div>`;

            if (pgExpanded) {
              html += `<div class="sub-item-list">`;
              pg.mergedItems.forEach(item => {
                const pd = item.purchaseDetails || {};
                const isPending = (pd.transferStatus||'pending') === 'pending';
                html += `<div class="sub-item-row" onclick="openItemDetail(${JSON.stringify(item.id)})" style="cursor:pointer">
                  <div class="item-main">
                    <div class="item-name">${esc(item.name)}</div>
                    <div class="item-sid">${esc(item.sid||'')} · ${esc(item.brand||'')}${ownerBadgeHtml(item)}</div>
                    <div class="item-tags">
                      <span class="tag ${isPending?'pending':'completed'}">${isPending?'待转运':'已转运'}</span>
                      ${pd.transferBatch?`<span class="tag">${esc(pd.transferBatch)}</span>`:''}
                      ${item.qty>1?`<span class="tag">×${item.qty}</span>`:''}
                    </div>
                    <div style="font-size:11px;color:#8e8e93;margin-top:3px">
                      ${pd.originalPrice?`原价${esc(String(pd.originalPrice))}`:''}
                      ${pd.domesticShipping?` · 运费¥${fmtMoney(pd.domesticShipping)}`:''}
                      ${pd.fee?` · 手续费¥${fmtMoney(pd.fee)}`:''}
                      ${pd.transferCoefficient?` · 系数${pd.transferCoefficient}`:''}
                      ${pd.preTransferCost?` · 在途¥${fmtMoney(pd.preTransferCost)}`:''}
                      ${toNum(pd.transferCost)>0?` · 转运¥${fmtMoney(pd.transferCost)}`:''}
                    </div>
                  </div>
                  <div class="item-right">
                    <div class="item-cost">¥${fmtMoney(item.cost)}</div>
                    ${item.qty>1?`<div class="item-qty">×${item.qty}</div>`:''}
                  </div>
                </div>`;
              });
              html += `</div>`;
            }
            html += `</div>`; // purchase group
      });
    }

  } else {
    // Transfer list
    html += `<div class="filter-bar">`;
    ['日淘','美淘'].forEach(c => {
      html += `<button class="filter-chip ${APP.transferCat===c?'active':''}" onclick="setTransferCat('${c}')">${esc(c)}</button>`;
    });
    html += `</div>`;

    const transfers = buildTransferList(APP.transferCat||'日淘');
    if (transfers.length === 0) {
      html += `<div class="empty-state">暂无转运记录</div>`;
    } else {
      transfers.forEach(t => {
        const tKey = 'transfer_' + t.transferId;
        const tExpanded = APP.collapsedGroups[tKey] === true;

        // find items for this transfer
        const tItems=getTransferItems(t);
        const transferCategory=tItems[0]?.category||t.category||'日淘';
        const transferBatch=tItems[0]?.batch||t.batch||'-';

        html += `<div class="transfer-card">
          <div class="transfer-header" onclick="togglePurGroup('${esc(tKey)}')">
            <div>
              <div class="transfer-id">${esc(t.transferBatch||t.transferId)}</div>
              <div class="transfer-meta">
                ${t.date?esc(t.date)+' · ':''}
                ${esc(transferCategory)} ${esc(transferBatch)}
                · ${(t.itemIds||[]).length} 件
                ${t.paymentAccount?' · '+esc(t.paymentAccount):''}
              </div>
            </div>
            <div style="text-align:right">
              <div class="transfer-amount">¥${fmtMoney(t.totalRMB)}</div>
              <span class="chevron ${tExpanded?'open':''}">▶</span>
            </div>
          </div>`;

        if (tExpanded && tItems.length > 0) {
          html += `<div class="item-list">`;
          const merged = mergeItemsBySid(tItems);
          merged.forEach(item => {
            const pd = item.purchaseDetails || {};
            html += `<div class="item-row" onclick="openItemDetail(${JSON.stringify(item.id)})" style="cursor:pointer">
              <div class="item-main">
                <div class="item-name">${esc(item.name)}</div>
                <div class="item-sid">${esc(item.sid||'')} · ${esc(item.brand||'')} · ${esc(item.status==='inventory'?'已入库':'采购中')}${ownerBadgeHtml(item)}</div>
                <div style="font-size:11px;color:#8e8e93;margin-top:2px">
                  系数${toNum(pd.transferCoefficient,1)} · 转运¥${fmtMoney(pd.transferCost)}
                </div>
              </div>
              <div class="item-right">
                <div class="item-cost">¥${fmtMoney(item.cost)}</div>
                ${item.qty>1?`<div class="item-qty">×${item.qty}</div>`:''}
              </div>
            </div>`;
          });
          html += `</div>`;
        }
        html += `</div>`; // transfer-card
      });
    }
  }

  document.getElementById('purchase-content').innerHTML = html;
}

function setPurchaseTab(v) { APP.purchaseTab=v; renderPurchase(); }
function setPurchaseBatchFilter(v) { APP.purchaseBatchFilter=v; renderPurchase(); }
function setPurchaseKeyword(v) {
  const input=document.getElementById('purchase-keyword');
  const start=input?.selectionStart, end=input?.selectionEnd;
  APP.purchaseKeyword=v; renderPurchase();
  const next=document.getElementById('purchase-keyword');
  if(next){next.focus(); if(start!==null&&start!==undefined) next.setSelectionRange(start,end);}
}
function togglePurchaseGroup(key,isLatest) { APP.purchaseExpandedGroups[key]=!isPurchaseGroupExpanded(key,isLatest); renderPurchase(); }
function setVisiblePurchaseGroupsExpanded(expanded) {
  getVisiblePurchaseGroups().forEach(({key})=>{APP.purchaseExpandedGroups[key]=expanded;});
  renderPurchase();
}
function setPurchaseSubTab(v) { APP.purchaseTransferTab=v; renderPurchase(); }
function setTransferCat(v) { APP.transferCat=v; renderPurchase(); }
function togglePurGroup(key) {
  APP.collapsedGroups[key] = !APP.collapsedGroups[key];
  renderPurchase();
}
</script>

<script>
// ===== FINANCE MODULE =====
function getFinanceStats() {
  const records = filterOwnerRecords(APP.data.finance.records);
  const loans = filterOwnerRecords(APP.data.finance.loans);
  const totalIncome = records.reduce((s,r)=>r.type==='income'?s+toNum(r.amount):s, 0);
  const totalExpense = records.reduce((s,r)=>r.type==='expense'?s+toNum(r.amount):s, 0);
  const totalBorrowed = loans.reduce((s,r)=>r.type==='borrow'?s+toNum(r.amount):s, 0);
  const totalLent = loans.reduce((s,r)=>r.type==='lend'?s+toNum(r.amount):s, 0);
  return { totalIncome, totalExpense, netBalance:totalIncome-totalExpense, totalBorrowed, totalLent, netLoan:totalBorrowed-totalLent };
}

function buildLoanSummary() {
  const loans = filterOwnerRecords(APP.data.finance.loans);
  const map = {};
  loans.forEach(l => {
    const cp = l.counterparty || '未知';
    if (!map[cp]) map[cp] = { counterparty:cp, borrowAmount:0, repayAmount:0, borrowCount:0, repayCount:0, records:[] };
    const g = map[cp];
    if (l.type === 'borrow') { g.borrowAmount += toNum(l.amount); g.borrowCount++; }
    else if (l.type === 'lend') { g.repayAmount += toNum(l.amount); g.repayCount++; } // lend=还款/归还
    g.records.push(l);
  });
  return Object.values(map).filter(g => g.borrowAmount > 0).map(g => ({
    ...g,
    balance: g.borrowAmount - g.repayAmount,
    progressPercent: g.borrowAmount > 0 ? Math.min(100, g.repayAmount/g.borrowAmount*100) : 0,
  }));
}

function getLoanStatus(g) {
  if (g.balance <= 0) return { text:'已还清', color:'#34c759' };
  if (g.repayAmount > 0) return { text:'还款中', color:'#ff9500' };
  return { text:'未还', color:'#ff3b30' };
}

function renderFinance() {
  const pageTitle=document.getElementById('finance-page-title');
  const navLabel=document.getElementById('finance-nav-label');
  if(APP.ownerFilter==='payton') {
    if(pageTitle)pageTitle.textContent='皮蛋金库';
    if(navLabel)navLabel.textContent='金库';
    renderPaytonFinance();
    return;
  }
  if(pageTitle)pageTitle.textContent='公共收支';
  if(navLabel)navLabel.textContent='收支';
  const finTab = APP.financeTab;
  const fStats = getFinanceStats();

  document.getElementById('finance-subtitle').textContent =
    `收支净额 ¥${fmtMoney(fStats.netBalance)}`;

  let html = '';

  // Top tabs
  html += `<div class="view-tabs" style="margin-top:10px">
    <button class="view-tab ${finTab==='records'?'active':''}" onclick="setFinanceTab('records')">公共收支</button>
    <button class="view-tab ${finTab==='loans'?'active':''}" onclick="setFinanceTab('loans')">借贷关系</button>
  </div>`;

  if (finTab === 'records') {
    // Finance records
    html += `<div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-val green">${fmtMoney(fStats.totalIncome)}</div><div class="stat-label">总收入</div></div>
      <div class="stat-card"><div class="stat-val red">${fmtMoney(fStats.totalExpense)}</div><div class="stat-label">总支出</div></div>
      <div class="stat-card"><div class="stat-val ${fStats.netBalance>=0?'green':'red'}">${fmtMoney(fStats.netBalance)}</div><div class="stat-label">净余额</div></div>
    </div>`;

    const records = filterOwnerRecords(APP.data.finance.records).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    if (records.length === 0) {
      html += `<div class="empty-state">暂无收支记录</div>`;
    } else {
      html += `<div class="card" style="margin-top:10px">`;
      records.forEach(r => {
        html += `<div class="finance-row">
          <div>
            <div class="finance-item-name">${esc(r.item||'')}</div>
            <div class="finance-date">${esc(r.date||'')}${r.note?' · '+esc(r.note):''}</div>
          </div>
          <div class="finance-amount ${r.type}">${r.type==='income'?'+':'-'}¥${fmtMoney(r.amount)}</div>
        </div>`;
      });
      html += `</div>`;
    }

  } else if (finTab === 'loans') {
    // Loan records
    html += `<div class="stats-row">
      <div class="stat-card"><div class="stat-val orange">${fmtMoney(fStats.totalBorrowed)}</div><div class="stat-label">总借入</div></div>
      <div class="stat-card"><div class="stat-val green">${fmtMoney(fStats.totalLent)}</div><div class="stat-label">已还款</div></div>
      <div class="stat-card"><div class="stat-val ${fStats.netLoan>=0?'orange':'green'}">${fmtMoney(fStats.netLoan)}</div><div class="stat-label">待还余额</div></div>
    </div>`;

    const loanSummary = buildLoanSummary();
    if (loanSummary.length === 0) {
      html += `<div class="empty-state">暂无借贷记录</div>`;
    } else {
      loanSummary.forEach(g => {
        const status = getLoanStatus(g);
        html += `<div class="loan-party-card">
          <div class="row-flex">
            <div class="loan-party-name">${esc(g.counterparty)}</div>
            <span style="font-size:12px;font-weight:600;color:${status.color}">${status.text}</span>
          </div>
          <div class="loan-progress">
            <div class="loan-progress-bar" style="width:${g.progressPercent.toFixed(1)}%;background:${status.color}"></div>
          </div>
          <div style="display:flex;gap:16px;font-size:13px;color:#8e8e93">
            <span>借入 <b style="color:#1c1c1e">¥${fmtMoney(g.borrowAmount)}</b></span>
            <span>已还 <b style="color:#34c759">¥${fmtMoney(g.repayAmount)}</b></span>
            <span>余额 <b style="color:${g.balance>0?'#ff3b30':'#34c759'}">¥${fmtMoney(g.balance)}</b></span>
          </div>
          <div style="margin-top:8px">`;
        // individual loan records
        g.records.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).forEach(l => {
          const typeLabel = l.type==='borrow'?'借入':l.type==='lend'?'还款':'其它';
          const typeColor = l.type==='borrow'?'#ff9500':'#34c759';
          html += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #f2f2f7">
            <span style="color:#8e8e93">${esc(l.date||'')} <span style="color:${typeColor}">${typeLabel}</span>${l.note?' · '+esc(l.note):''}</span>
            <b>¥${fmtMoney(l.amount)}</b>
          </div>`;
        });
        html += `</div></div>`;
      });
    }
  }

  document.getElementById('finance-content').innerHTML = html;
}

function renderPaytonFinance() {
  const owner=APP.data.ownerRegistry.payton||{};
  const fund=getPaytonFundBreakdown();
  const loans=Array.isArray(owner.loans)?owner.loans:[];
  const transfers=Array.isArray(owner.accountTransfers)?owner.accountTransfers:[];
  const records=APP.data.finance.records.filter(r=>r.owner==='payton').slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  document.getElementById('finance-subtitle').textContent=`零钱 ¥${fmtMoney(fund.pocket)} · 投资 ¥${fmtMoney(fund.investment)}`;
  let html=`<div class="account-cards">
    <div class="account-card"><div class="account-name">零钱</div><div class="account-balance ${fund.pocket>=0?'pos':'neg'}">¥${fmtMoney(fund.pocket)}</div></div>
    <div class="account-card"><div class="account-name">投资账户</div><div class="account-balance ${fund.investment>=0?'pos':'neg'}">¥${fmtMoney(fund.investment)}</div></div>
    <div class="account-card"><div class="account-name">贷款剩余</div><div class="account-balance">¥${fmtMoney(fund.loanRemaining)}</div></div>
    <div class="account-card"><div class="account-name">Payton's 基金</div><div class="account-balance ${fund.balance>=0?'pos':'neg'}">¥${fmtMoney(fund.balance)}</div></div>
  </div>
  <div class="view-tabs" style="margin-top:10px">
    <button class="view-tab ${APP.paytonFinanceTab==='records'?'active':''}" onclick="setPaytonFinanceTab('records')">零花收支</button>
    <button class="view-tab ${APP.paytonFinanceTab==='loans'?'active':''}" onclick="setPaytonFinanceTab('loans')">贷款清单</button>
    <button class="view-tab ${APP.paytonFinanceTab==='transfers'?'active':''}" onclick="setPaytonFinanceTab('transfers')">零钱↔投资互转</button>
  </div>`;
  if(APP.paytonFinanceTab==='records') {
    if(!records.length) html+='<div class="empty-state">暂无零花收支</div>';
    else { html+='<div class="card" style="margin-top:10px">'; records.forEach(r=>{html+=`<div class="finance-row"><div><div class="finance-item-name">${esc(r.item||'')}</div><div class="finance-date">${esc(r.date||'')}${r.note?' · '+esc(r.note):''}</div></div><div class="finance-amount ${r.type}">${r.type==='income'?'+':'−'}¥${fmtMoney(r.amount)}</div></div>`}); html+='</div>'; }
  } else if(APP.paytonFinanceTab==='loans') {
    if(!loans.length) html+='<div class="empty-state">暂无贷款</div>';
    else loans.forEach(loan=>{
      const events=Array.isArray(loan.events)?loan.events:[];
      html+=`<div class="card" style="margin-top:10px;padding:12px"><div class="row-flex"><div><div class="item-name">${esc(loan.name||'未命名贷款')}</div><div class="finance-date">${esc(loan.startDate||'')} — ${esc(loan.dueDate||'未设到期日')}</div></div><div class="item-cost">剩余 ¥${fmtMoney(loan.remaining)}</div></div>`;
      if(events.length)events.forEach(event=>{html+=`<div class="finance-row"><div class="finance-date">${esc(event.date||'')} · ${event.type==='borrow'?'追加借款':'还款'}${event.note?' · '+esc(event.note):''}</div><div>¥${fmtMoney(event.amount)}</div></div>`});
      html+='</div>';
    });
  } else {
    if(!transfers.length) html+='<div class="empty-state">暂无账户互转记录</div>';
    else { html+='<div class="card" style="margin-top:10px">'; transfers.forEach(t=>{const from=t.fromAccount==='invest'?'投资账户':'零钱',to=t.toAccount==='invest'?'投资账户':'零钱';html+=`<div class="finance-row"><div><div class="finance-item-name">${from} → ${to}</div><div class="finance-date">${esc(t.date||'')}${t.note?' · '+esc(t.note):''}</div></div><div class="finance-amount">¥${fmtMoney(t.amount)}</div></div>`});html+='</div>'; }
  }
  document.getElementById('finance-content').innerHTML=html;
}

function setPaytonFinanceTab(v) { APP.paytonFinanceTab=['records','loans','transfers'].includes(v)?v:'records'; renderFinance(); }
function toggleFinanceGroup(key) {

  renderFinance();
}

<script>
// ===== HOME / DATA INSIGHTS MODULE =====

    result.push({year,month,count:items.length,revenue,cost,profit});

function getPurchaseStatus() {

  const inProgressAmount=items.reduce((s,i)=>s+toNum(i.cost),0);
  const purchaseAmount=items.reduce((s,i)=>s+toNum(i.purchaseDetails?.preTransferCost),0);

function getBatchReturnStats() {
  const items=APP.data.items;
  const batchMap={};
  const categoryMap={
    '2025JAPAN':{category:'2025JAPAN',totalCost:0,revenue:0},
    '美淘':{category:'美淘',totalCost:0,revenue:0},
    '日淘':{category:'日淘',totalCost:0,revenue:0},
    '国内':{category:'国内',totalCost:0,revenue:0},
  };
  const catOrder={'2025JAPAN':1,'美淘':2,'日淘':3,'国内':4};
  const batchOrderMap={
    '美淘':{'A组上半年':1,'A组下半年':2,'B组下半年':3,'26上半年':4},
    '日淘':{'a批':1,'b批':2,'d批':3,'预订':4,'预订批':4,'26d批':5,'26e批':6,'26f批':7},
  };

  const allCostMap={}, allCatCostMap={};
  items.forEach(item=>{
    const key=`${item.category}|${item.batch}`;
    if(item.category&&!categoryMap[item.category]) categoryMap[item.category]={category:item.category,totalCost:0,revenue:0};
    allCostMap[key]=(allCostMap[key]||0)+toNum(item.cost);
    allCatCostMap[item.category]=(allCatCostMap[item.category]||0)+toNum(item.cost);
    if(!batchMap[key]) batchMap[key]={category:item.category,batch:item.batch,totalCost:0,revenue:0};
  });

  const saleGroups={};
  items.forEach(item=>{
    if(item.status!=='sold') return;
    const gk=`${item.owner||'papa'}|${item.sid||''}|${item.saleDetails?.date||''}`;
    if(!saleGroups[gk]) saleGroups[gk]={sid:item.sid,category:item.category,batch:item.batch,price:0};
    saleGroups[gk].price+=toNum(item.totalPrice||item.saleDetails?.price);
  });

  Object.values(saleGroups).forEach(sale=>{
    const key=`${sale.category}|${sale.batch}`;
    if(!batchMap[key]) batchMap[key]={category:sale.category,batch:sale.batch,totalCost:0,revenue:0};
    batchMap[key].revenue+=sale.price;
    if(categoryMap[sale.category]) categoryMap[sale.category].revenue+=sale.price;
  });

  Object.keys(batchMap).forEach(k=>{ batchMap[k].totalCost=allCostMap[k]||0; });
  Object.keys(categoryMap).forEach(c=>{ categoryMap[c].totalCost=allCatCostMap[c]||0; });

  const catResults=Object.values(categoryMap)
    .map(c=>({...c,batch:'',isCategory:true,rate:c.totalCost>0?(c.revenue/c.totalCost)*100:0}))
    .filter(c=>c.totalCost>0)
    .sort((a,b)=>(catOrder[a.category]||99)-(catOrder[b.category]||99));

  const batchResults=Object.values(batchMap)
    .map(b=>({...b,rate:b.totalCost>0?(b.revenue/b.totalCost)*100:0}))
    .sort((a,b)=>{
      const co=(catOrder[a.category]||99)-(catOrder[b.category]||99);
      if(co!==0) return co;
      const bo=(batchOrderMap[a.category]?.[a.batch]||99)-(batchOrderMap[b.category]?.[b.batch]||99);
      return bo;
    });

  const result=[];
  catResults.forEach(cat=>{
    result.push(cat);
    result.push(...batchResults.filter(b=>b.category===cat.category));
  });

  let allTotalCost=0, allRevenue=0;
  Object.values(allCostMap).forEach(v=>{ allTotalCost+=v; });
  Object.values(batchMap).forEach(b=>{ allRevenue+=b.revenue; });
  result.push({category:'汇总',batch:'',totalCost:allTotalCost,revenue:allRevenue,
    rate:allTotalCost>0?(allRevenue/allTotalCost)*100:0,isCategory:false,isSummary:true});
  return result;
}

// Search (full logic from useHomeInsights.js)
function normalizeText(v='') {
  return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/[\-_/.,，。；;:：()（）\[\]【】]/g,'');
}
function isSubsequence(query='',target='') {
  if(!query||!target) return false;
  let qi=0;
  for(let i=0;i<target.length&&qi<query.length;i++) if(target[i]===query[qi]) qi++;
  return qi===query.length;
}
function statusKeywords(status='') {
  if(status==='sold') return ['sold','已售'];
  if(status==='inventory') return ['inventory','库存','在库'];
  if(status==='purchase') return ['purchase','采购','采购中'];
  return [String(status||'')];
}
function itemSearchText(item={}) {
  const p=item.purchaseDetails||{};
  return [item.sid,item.name,item.brand,item.category,item.batch,
    p.website,p.websiteAccount,p.paymentAccount,p.paymentBatch,...statusKeywords(item.status)]
    .filter(Boolean).join(' ');
}

function searchItems(keyword='') {
  const raw=String(keyword||'').trim().toLowerCase();
  if(!raw) return [];
  const normKw=normalizeText(raw);
  const tokens=raw.split(/\s+/).filter(Boolean);
  const normTokens=tokens.map(t=>normalizeText(t)).filter(Boolean);

  const scored=APP.data.items.map(item=>{
    const sid=String(item.sid||'').toLowerCase();
    const name=String(item.name||'').toLowerCase();
    const brand=String(item.brand||'').toLowerCase();
    const text=itemSearchText(item).toLowerCase();
    const sidN=normalizeText(sid), nameN=normalizeText(name), brandN=normalizeText(brand), textN=normalizeText(text);
    let score=0; const reasons=new Set();

    if(sid===raw){score+=300;reasons.add('SID精确');}
    if(sidN===normKw){score+=260;reasons.add('SID标准化');}
    if(name===raw){score+=220;reasons.add('名称精确');}
    if(nameN===normKw){score+=180;reasons.add('名称标准化');}
    if(brand===raw){score+=140;reasons.add('品牌精确');}
    if(sid.includes(raw)){score+=160;reasons.add('SID命中');}
    if(name.includes(raw)){score+=120;reasons.add('名称命中');}
    if(brand.includes(raw)){score+=90;reasons.add('品牌命中');}
    if(text.includes(raw)){score+=50;reasons.add('综合字段命中');}
    if(sidN.includes(normKw)){score+=120;reasons.add('SID模糊');}
    if(nameN.includes(normKw)){score+=80;reasons.add('名称模糊');}
    if(textN.includes(normKw)){score+=40;reasons.add('字段模糊');}
    if(isSubsequence(normKw,sidN)){score+=70;reasons.add('SID联想');}
    if(isSubsequence(normKw,nameN)){score+=50;reasons.add('名称联想');}
    const tokenHits=normTokens.reduce((h,t)=>textN.includes(t)||isSubsequence(t,textN)?h+1:h,0);
    if(normTokens.length>1&&tokenHits>0){score+=tokenHits*25;reasons.add('多词命中');}
    if(normTokens.length>1&&tokenHits===normTokens.length){score+=60;reasons.add('多词全中');}

    return {item,score,reasons:Array.from(reasons)};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);

  const mergedMap=new Map(), mergedList=[];
  function mergeKeyOf(item={}) {
    const status=String(item.status||'');
    if(!['purchase','inventory'].includes(status)) return null;
    const p=item.purchaseDetails||{};
    const cost=Number(item.cost||0), tc=Number(p.transferCost||0);
    return [itemOwner(item),String(item.sid||''),status,cost.toFixed(4),String(p.transferStatus||''),
      String(p.transferBatch||''),tc.toFixed(4)].join('|');
  }

  scored.forEach(({item,score,reasons})=>{
    const key=mergeKeyOf(item);
    const rSet=new Set(reasons||[]);
    if(!key){
      mergedList.push({...item,_isMerged:false,_groupCount:1,_groupTotalCost:Number(item.cost||0),
        _groupItems:[item],_searchMatchTypes:Array.from(rSet).slice(0,3)});
      return;
    }
    const existing=mergedMap.get(key);
    if(!existing){
      const rec={...item,_isMerged:true,_groupCount:1,_groupTotalCost:Number(item.cost||0),
        _groupItems:[item],_searchScore:score,_reasonSet:rSet};
      mergedMap.set(key,rec); mergedList.push(rec); return;
    }
    existing._groupCount++;
    existing._groupTotalCost+=Number(item.cost||0);
    existing._groupItems.push(item);
    if(score>Number(existing._searchScore||0)) existing._searchScore=score;
    rSet.forEach(r=>existing._reasonSet.add(r));
  });

  return mergedList.sort((a,b)=>Number(b._searchScore||0)-Number(a._searchScore||0))
    .map(x=>({...x,_searchMatchTypes:Array.from(x._reasonSet||x._searchMatchTypes||[]).slice(0,3),
      _groupTotalCost:Number(x._groupTotalCost||0),_searchScore:undefined,_reasonSet:undefined}));
}

function statusText(s) {
  if(s==='inventory') return '库存';
  if(s==='sold') return '已售';
  if(s==='purchase') return '采购中';
  return s||'-';
}

// 公共支出净额：支出 - 收入（与主应用「公共支出」口径一致）
function getOwnerPublicExpense() {
  const records=filterOwnerRecords(APP.data.finance.records);
  const exp=records.filter(r=>r.type==='expense').reduce((s,r)=>s+toNum(r.amount),0);
  const inc=records.filter(r=>r.type==='income').reduce((s,r)=>s+toNum(r.amount),0);
  return exp - inc;
}

function getPapaPublicExpense() {
  const records=filterOwnerRecords(APP.data.finance.records,'papa');
  const exp=records.filter(r=>r.type==='expense').reduce((s,r)=>s+toNum(r.amount),0);
  const inc=records.filter(r=>r.type==='income').reduce((s,r)=>s+toNum(r.amount),0);
  return exp-inc;
}

function getPapaLoanBalance() {
  return filterOwnerRecords(APP.data.finance.loans,'papa').reduce((sum,loan)=>{
    if(loan?.isRepaid||loan?.repaid) return sum;
    return sum+(loan?.type==='borrow'?toNum(loan.amount):-toNum(loan.amount));
  },0);
}

function getPaytonFundBreakdown() {
  const owner=APP.data?.ownerRegistry?.payton||{};
  const pocket=toNum(owner.pocketBalance), investment=toNum(owner.investBalance);
  const loanRemaining=(Array.isArray(owner.loans)?owner.loans:[]).reduce((sum,loan)=>sum+(loan?.status==='active'?toNum(loan.remaining):0),0);
  return {pocket,investment,loanRemaining,balance:pocket+investment-loanRemaining};
}

function calcAlipayBalance() {
  const papaItems=filterOwnerItems(APP.data.items,'papa');
  const inv=papaItems.filter(i=>i.status==='inventory');
  const invValue=inv.reduce((s,i)=>s+toNum(i.cost),0);
  const sold=papaItems.filter(i=>i.status==='sold');
  const financePublicExpense=getPapaPublicExpense();
  const totalActualProfit=sold.reduce((s,i)=>s+toNum(i.saleDetails?.profit),0) - financePublicExpense;
  const financeLoanBalance=getPapaLoanBalance();
  const purchaseTotalCost=papaItems.filter(i=>i.status==='purchase').reduce((s,i)=>s+toNum(i.cost),0);

  return toNum(APP.calc.debt)
    + financeLoanBalance
    + totalActualProfit
    - invValue
    - toNum(APP.calc.unconfirmed)
    + getPaytonFundBreakdown().balance
    - purchaseTotalCost;
}

function getCashflowData(now=new Date()) {
  const owner=APP.ownerFilter, paytonMode=owner==='payton';
  const items=filterOwnerItems(APP.data.items,owner), snapshots=APP.data.snapshots||[];
  const openingAt=paytonMode?String(APP.data.ownerRegistry.payton?.openingAt||'2026-10-15'):'';
  const openingMonth=openingAt.slice(0,7);
  const loans=paytonMode?(APP.data.ownerRegistry.payton?.loans||[]):filterOwnerRecords(APP.data.finance.loans,owner);
  const loanBalance=loans.reduce((sum,loan)=>{
    if(paytonMode)return sum+(loan?.status==='active'?toNum(loan.remaining):0);
    if(loan?.isRepaid||loan?.repaid)return sum;
    return sum+(loan?.type==='borrow'?toNum(loan.amount):-toNum(loan.amount));
  },0);
  const currentDebt=paytonMode?loanBalance:toNum(APP.calc.debt)+loanBalance;
  const monthMatch=(date,year,month)=>{if(!date)return false;const d=new Date(date);return !Number.isNaN(d.getTime())&&d.getFullYear()===year&&d.getMonth()+1===month};
  const getLastMonths=(count)=>Array.from({length:count},(_,index)=>{const d=new Date(now.getFullYear(),now.getMonth()-(count-1-index),1);return {year:d.getFullYear(),month:d.getMonth()+1}});
  const absoluteDebt=(year,month)=>{
    const target=snapshots.filter(s=>monthMatch(s?.date,year,month)).slice().sort((a,b)=>String(b?.date||'').localeCompare(String(a?.date||'')))[0];
    if(!target)return null;
    if(paytonMode)return Number.isFinite(Number(target?.payton?.loanRemaining))?Number(target.payton.loanRemaining):null;
    return toNum(target.calc?.debt)+toNum(target.finance?.loanBalance);
  };
  const previousMonth=(year,month)=>month===1?{year:year-1,month:12}:{year,month:month-1};
  const months=getLastMonths(12);
  const buildMonth=(year,month,liveDebt)=>{
    if(paytonMode&&`${year}-${String(month).padStart(2,'0')}`<openingMonth)return {year,month,netCollection:null,inventoryDigestion:null,procurement:null,debt:null,totalDebt:null};
    const sold=items.filter(i=>i.status==='sold'&&monthMatch(i.saleDetails?.date,year,month));
    const netCollection=sold.reduce((sum,i)=>sum+toNum(i.saleDetails?.profit)+toNum(i.cost),0);
    const inventoryDigestion=sold.reduce((sum,i)=>sum+toNum(i.cost),0);
    const procurement=items.filter(i=>monthMatch(i.purchaseDetails?.date,year,month)).reduce((sum,i)=>sum+toNum(i.cost),0);
    const totalDebt=liveDebt!==undefined?liveDebt:absoluteDebt(year,month);
    const prev=previousMonth(year,month),previousDebt=absoluteDebt(prev.year,prev.month);
    return {year,month,netCollection,inventoryDigestion,procurement,debt:totalDebt==null||previousDebt==null?null:totalDebt-previousDebt,totalDebt};
  };
  return {current:buildMonth(now.getFullYear(),now.getMonth()+1,currentDebt),last12Months:months.map(m=>buildMonth(m.year,m.month,m.year===now.getFullYear()&&m.month===now.getMonth()+1?currentDebt:undefined))};
}

function fmtCashflowShort(value) {
  if(value==null)return '--';
  const n=Number(value),abs=Math.abs(n);
  if(abs>=10000)return `${(n/10000).toFixed(2)}w`;
  if(abs>=1000)return `${(n/1000).toFixed(1)}k`;
  return n.toFixed(0);
}

function renderCashflowMonitor() {
  const data=getCashflowData(),months=data.last12Months;
  const metrics=[{key:'netCollection',label:'每月净回款',color:'#16a34a'},{key:'procurement',label:'每月采购投入',color:'#f97316'},{key:'debt',label:'每月新增负债',color:'#3b82f6'}];
  let html='<div class="card" style="margin-top:10px;background:#f9fafb"><div class="card-header"><div class="card-title">现金流与负债监控</div></div><div class="card-body">';
  html+='<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">';
  metrics.forEach(metric=>{
    const values=months.map(m=>m[metric.key]).filter(v=>v!=null),max=Math.max(...values.map(v=>Math.abs(v)),0.01),cur=data.current[metric.key],prev=months.at(-2)?.[metric.key];
    const change=cur==null||prev==null||prev===0?null:(cur-prev)/prev*100;
    html+=`<div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px"><div style="font-size:10px;color:#6b7280">${metric.label}</div><div style="font-size:16px;font-weight:800;margin:4px 0">${fmtMoney(cur)}</div><div style="display:flex;flex-direction:column;gap:3px">`;
    months.forEach(m=>{const value=m[metric.key],width=value==null?0:Math.min(100,Math.abs(value)/max*100);html+=`<div style="display:flex;align-items:center;gap:3px;font-size:8px;color:#9ca3af"><span style="width:19px">${m.month}月</span><div style="height:7px;flex:1;background:#e5e7eb;border-radius:3px;overflow:hidden"><div style="width:${width}%;height:100%;background:${m.year===new Date().getFullYear()&&m.month===new Date().getMonth()+1?metric.color:'#cbd5e1'}"></div></div><span style="width:22px;text-align:right">${fmtCashflowShort(value)}</span></div>`});
    html+='</div><div style="font-size:9px;margin-top:5px;color:'+(change==null?'#9ca3af':change>=0?'#16a34a':'#ef4444')+'">'+(change==null?'--':`${change>=0?'↑':'↓'} ${Math.abs(change).toFixed(1)}% 环比`)+'</div></div>';
  });
  html+='</div><div style="font-weight:700;font-size:12px;margin:14px 0 6px">12 个月现金流与负债趋势</div><div style="overflow-x:auto"><table style="width:100%;min-width:440px;border-collapse:collapse;font-size:10px"><thead><tr>'+['月份','净回款','采购投入','现金流差额','负债总规模'].map(x=>`<th style="padding:5px;text-align:right;color:#6b7280;border-bottom:1px solid #e5e7eb">${x}</th>`).join('')+'</tr></thead><tbody>';
  months.forEach(m=>{const diff=m.netCollection==null||m.procurement==null?null:m.netCollection-m.procurement;html+=`<tr><td style="padding:5px;border-bottom:1px solid #f3f4f6">${m.year}/${m.month}</td>${[m.netCollection,m.procurement,diff,m.totalDebt].map(v=>`<td style="padding:5px;text-align:right;border-bottom:1px solid #f3f4f6">${v==null?'--':fmtMoney(v)}</td>`).join('')}</tr>`});
  html+='</tbody></table></div></div></div>';
  return html;
}
